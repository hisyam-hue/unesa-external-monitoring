name: Automated External News Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Jalan otomatis setiap hari jam 00:00 UTC
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas feedparser beautifulsoup4 requests

      - name: Run External Scraper
        run: |
          python external_scraper.py

      - name: Generate Interactive Dashboard
        run: |
          python generate_dashboard_eksternal.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add .
          git diff-index --quiet HEAD || git commit -m "Auto-update external news & dashboard [skip ci]"
          git push

name: Automated External News Scraper

on:
  schedule:
    - cron: '0 1 * * *' # Runs daily at 08:00 WIB (01:00 UTC)
  workflow_dispatch: # Tombol pemicu manual

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas feedparser requests

      - name: Jalankan Scraper Berita Eksternal
        run: python external_scraper.py

      - name: Generate Dashboard HTML Terbaru
        run: python generate_dashboard_eksternal.py

      - name: Commit & Push Perubahan Data
        run: |
          git config --global user.name 'UNESA Monitoring Bot'
          git config --global user.email 'bot@unesa.ac.id'
          git add rekap_berita_eksternal.csv dashboard_eksternal.html index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data" && git push)

      - name: Send WhatsApp Notification
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
        run: |
          python send_wa.py

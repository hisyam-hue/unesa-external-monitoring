name: Daily Media Monitoring Scraper & WA Notifier

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Pemicu tombol manual

jobs:
  run-monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas feedparser beautifulsoup4 requests

      - name: Step 1 - Run Scraper
        run: |
          python external_scraper.py

      - name: Step 2 - Generate Dashboard
        run: |
          python generate_dashboard_eksternal.py

      - name: Step 3 - Send WhatsApp Notification
        continue-on-error: true
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
        run: |
          python send_wa.py

      - name: Step 4 - Commit & Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rekap_berita_eksternal.csv index.html
          git diff-index --quiet HEAD || git commit -m "Auto-update data berita, dashboard & notifikasi [skip ci]"
          git push
